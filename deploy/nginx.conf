# /etc/nginx/sites-available/kindhelp
# After saving, create the symlink and reload nginx:
#   sudo ln -s /etc/nginx/sites-available/kindhelp /etc/nginx/sites-enabled/kindhelp
#   sudo nginx -t && sudo systemctl reload nginx
#
# After this is up on port 80, run certbot for free TLS:
#   sudo certbot --nginx -d kindhelp.example.org

server {
    listen 80;
    server_name kindhelp.example.org;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_set_header   Host              $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
